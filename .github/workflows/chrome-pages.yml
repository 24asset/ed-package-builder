name: Chrome Website
on:
  push:
    branches: [main]
    paths: ['chrome-web-source.b64', '.github/workflows/chrome-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: chrome-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: base64 --decode chrome-web-source.b64 > chrome-web-source.zip
      - run: unzip -q chrome-web-source.zip -d chrome-source
      - name: Remove the PDF assignment dropdown from the current source bundle
        run: |
          if echo '799534fec919ee8c9ee32871c3a7dba8112ab924148c3840b0b186a98e000213  chrome-source/web/src/progression.js' | sha256sum --check --status; then
          git apply <<'PATCH'
          --- a/chrome-source/web/src/progression.js
          +++ b/chrome-source/web/src/progression.js
          @@ -19,5 +19,4 @@
           const sources=new Map();
           const originals=new Map();
          -const unassignedDocuments=new Set();
           const replacementFile=document.createElement('input');
           replacementFile.type='file';
          @@ -135,8 +134,6 @@
           }
           function packageAttachments(){
          - const used=taken();
            return `<section class="paper" aria-label="Package Documents"><h2>Package Documents</h2>
             <p class="hint">Check the document roles. Replace a corrected file here to keep its place in the package.</p>
          -  ${[...unassignedDocuments].filter(id=>!used.has(id)).map(id=>`<div class="row"><span class="source-name">${esc(sources.get(id).name)}</span><label>Assign to <select data-assign-document="${id}" ${opening||exporting?'disabled':''}><option value="">Choose document type</option>${Object.entries(packageDocumentLabels).map(([key,label])=>`<option value="${key}">${label}</option>`).join('')}</select></label></div>`).join('')}
             <div class="fields"><label>Selected bid amount ($)<input name="selectedBidAmount" type="number" min="0" step="0.01" value="${esc(draft.selectedBidAmount)}"></label></div>
             <div class="slots">${Object.entries(packageDocumentLabels).map(([kind,label])=>{
          @@ -398,7 +395,9 @@
              const kind=planned.get(id);
              if(kind){(draft.documents[kind]??=[]).push(sources.get(id));used.add(id);}
          -   else unassignedDocuments.add(id);
          -  }
          -  if(available.length)status(notice+' Check the document roles in Package Documents.');
          +  }
          +  if(available.length){
          +   const remaining=new Set(available.filter(({id})=>!used.has(id)).map(({id})=>id)).size;
          +   status(notice+(remaining?' Use the Package Documents buttons to select the remaining PDFs.':' Check the attachments in Package Documents.'));
          +  }
             opening=false;render();
            }
          @@ -426,5 +425,4 @@
            else if(id==='documents'){
             (draft.documents[key]??=[]).push(source);
          -  unassignedDocuments.delete(source.id);
            }else if(id==='property'&&source.type!=='application/pdf')draft[key].push(source);
            if(load)dialog.close();
          @@ -437,9 +435,4 @@
           });
           root.addEventListener('change',event=>{
          - const assign=event.target.dataset.assignDocument,kind=event.target.value;
          - if(assign&&kind&&Object.hasOwn(packageDocumentLabels,kind)&&unassignedDocuments.has(assign)&&!taken().has(assign)){
          -  (draft.documents[kind]??=[]).push(sources.get(assign));
          -  unassignedDocuments.delete(assign);render();return;
          - }
            const load=scope(activeLoad);
            if(event.target.id==='fill'){
          @@ -566,5 +559,4 @@
             if(index<0)return;
             documents[index]=source;
          -  unassignedDocuments.delete(source.id);
             if(kind==='selectedBid'&&source.id!==previousId)draft.selectedBidAmount='';
             status(packageDocumentLabels[kind]+' replaced. It will export in the same position.');
          PATCH
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chrome-source/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        working-directory: chrome-source/web
      - run: npm test
        working-directory: chrome-source/web
      - run: node prepare_runtime.mjs
        working-directory: chrome-source/web
      - name: Copy published photo reader assets
        working-directory: chrome-source/web
        run: |
          set -euo pipefail
          base=https://tiffanymnz.github.io/ed-package-builder
          get() {
            mkdir -p "public/$(dirname "$1")"
            curl -fLsS --retry 3 --max-time 120 "$base/$1" -o "public/$1"
          }
          get models/manifest.json
          for part in $(python -c 'import json; print(*json.load(open("public/models/manifest.json"))["vision.onnx"]["parts"])'); do get "models/$part"; done
          get models/annotation-recognizer.onnx
          get models/handwriting-server.onnx
          card=card-models/Florence-2-base-ft
          for asset in added_tokens.json config.json generation_config.json merges.txt preprocessor_config.json special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json onnx/decoder_model_merged_quantized.onnx onnx/embed_tokens_quantized.onnx onnx/encoder_model_quantized.onnx onnx/vision_encoder_quantized.onnx; do get "$card/$asset"; done
      - run: npm run build
        working-directory: chrome-source/web
      - name: Open the progression builder from the site root
        run: cp chrome-source/web/dist/progression.html chrome-source/web/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chrome-source/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Chrome website
        id: deployment
        uses: actions/deploy-pages@v4
