name: Chrome Website
on:
  push:
    branches: [main]
    paths: ['chrome-web-source.b64', '.github/workflows/chrome-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: chrome-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: base64 --decode chrome-web-source.b64 > chrome-web-source.zip
      - run: unzip -q chrome-web-source.zip -d chrome-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chrome-source/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        working-directory: chrome-source/web
      - run: npm test
        working-directory: chrome-source/web
      - run: node prepare_runtime.mjs
        working-directory: chrome-source/web
      - name: Copy published photo reader assets
        working-directory: chrome-source/web
        run: |
          set -euo pipefail
          base=https://tiffanymnz.github.io/ed-package-builder
          get() {
            mkdir -p "public/$(dirname "$1")"
            curl -fLsS --retry 3 --max-time 120 "$base/$1" -o "public/$1"
          }
          get models/manifest.json
          for part in $(python -c 'import json; print(*json.load(open("public/models/manifest.json"))["vision.onnx"]["parts"])'); do get "models/$part"; done
          get models/annotation-recognizer.onnx
          get models/handwriting-server.onnx
          card=card-models/Florence-2-base-ft
          for asset in added_tokens.json config.json generation_config.json merges.txt preprocessor_config.json special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json onnx/decoder_model_merged_quantized.onnx onnx/embed_tokens_quantized.onnx onnx/encoder_model_quantized.onnx onnx/vision_encoder_quantized.onnx; do get "$card/$asset"; done
      - run: npm run build
        working-directory: chrome-source/web
      - name: Open the progression builder from the site root
        run: cp chrome-source/web/dist/progression.html chrome-source/web/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chrome-source/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Chrome website
        id: deployment
        uses: actions/deploy-pages@v4
